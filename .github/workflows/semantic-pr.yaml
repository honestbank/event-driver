# DO NOT CHANGE. This file is being managed from a central repository
# To know more simply visit https://github.com/honestbank/.github/blob/main/docs/about.md

# yamllint disable rule:line-length
---
name: "repository-semantic-pr"
permissions: {}

on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  shared-semantic-pr:
    name: "repository-semantic-pr / shared-semantic-pr"
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        name: Semantic Pull Request
        # Aikido autofix PR titles carry no conventional-commit prefix; skip them.
        if: ${{ !startsWith(github.event.pull_request.title, '[Aikido]') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
