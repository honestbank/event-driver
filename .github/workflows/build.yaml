# DO NOT CHANGE. This file is being managed from a central repository
# To know more simply visit https://github.com/honestbank/.github/blob/main/docs/about.md

# yamllint disable rule:line-length
---
name: go-tests

permissions:
  contents: read

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOPRIVATE: github.com/honestbank

jobs:
  get-go-version:
    name: Get Go Version
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Get Go Version from go.mod
        id: get-version
        run: |
          GO_VERSION=$(grep -oP '^go \K[0-9]+\.[0-9]+' go.mod)
          echo "Go Version: $GO_VERSION"
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

  tests:
    name: go-tests
    needs: [get-go-version]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: ${{ needs.get-go-version.outputs.go_version }}
        id: go

      - name: Test and generate code coverage
        run: |
          set -o pipefail
          go test -race -coverprofile=coverage.txt -covermode=atomic -json ./... | tee test-report.json

      # Some repositories hold more than one Go module, for example an SDK with
      # extension modules beside it. The step above only covers the root module,
      # because `go test ./...` never descends into a nested module.
      #
      # A nested module is tested only when its own Makefile declares a `test`
      # target. That keeps demonstration and example modules out of CI, and it
      # lets a module say how it wants to be tested, which matters when a module
      # needs Docker Compose or an integration build tag. Repositories with a
      # single module find nothing here and behave exactly as before.
      - name: Test nested modules
        shell: bash
        run: |
          set -euo pipefail
          [ -f coverage.txt ] || echo "mode: atomic" > coverage.txt
          while IFS= read -r module; do
            directory=$(dirname "${module}")
            if [ "${directory}" = "." ]; then
              continue
            fi
            if [ ! -f "${directory}/Makefile" ]; then
              echo "Skipping ${directory}: no Makefile."
              continue
            fi
            if ! grep -qE '^test:' "${directory}/Makefile"; then
              echo "Skipping ${directory}: the Makefile declares no test target."
              continue
            fi
            echo "Testing ${directory}"
            make -C "${directory}" test
            for profile in cover.out coverage.txt coverage.out; do
              if [ -f "${directory}/${profile}" ]; then
                tail -n +2 "${directory}/${profile}" >> coverage.txt
                rm "${directory}/${profile}"
                break
              fi
            done
          done < <(find . -name go.mod -not -path './vendor/*' -not -path '*/testdata/*' | sort)

      - name: sonarcloud-scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      # These repositories are public, so they cannot reach the shared
      # pre-commit workflow that lints our other Go code: that one lives in the
      # internal workflows repository. We run golangci-lint here instead.
      #
      # This step comes last on purpose. SonarCloud Code Analysis is a required
      # check, and a step that fails earlier in a job skips every step after it,
      # so linting first would let a lint failure withhold the SonarCloud result
      # and leave the pull request unable to merge at all.
      - name: Go lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9.2.1
        with:
          version: latest
          args: --timeout=5m --modules-download-mode=readonly

  release:
    name: semantic-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [get-go-version, tests]
    steps:
      - name: Set up Golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: ${{ needs.get-go-version.outputs.go_version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90  # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.ENGINEERING_GITHUB_PERSONAL_ACCESS_TOKEN }}
        with:
          branch: ${{ github.event.repository.default_branch }}
          semantic_version: 19
          extra_plugins: |
            @semantic-release/git@10.0.1
